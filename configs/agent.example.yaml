# ViMax agent runtime local configuration template.
# Keep real keys out of commits. Prefer environment variables for shared or CI usage.

llm:
  model_provider: openai
  model: <YOUR_LLM_MODEL>
  base_url: <YOUR_LLM_BASE_URL>
  api_key: ''

audio:
  model_provider: native        # native (giữ âm thanh/thoại gốc từ video), elevenlabs, hoặc edge-tts
  model: eleven_multilingual_v2 # hoặc vi-VN-NamMinhNeural (Edge-TTS); bỏ qua nếu provider=native
  base_url: https://api.elevenlabs.io/v1
  api_key: ''                   # ElevenLabs API key (native / Edge-TTS để trống)
  voice: 21m00Tcm4TlvDq8ikWAM   # Giọng mặc định / Người dẫn chuyện (Narrator)
  bgm_file: ''                  # Đường dẫn file nhạc nền mp3/wav (nếu có)
  bgm_volume: 0.15              # Âm lượng nhạc nền (0.0 - 1.0)

  # Phân vai nhiều giọng đọc cho nhiều nhân vật (chỉ dùng khi model_provider là elevenlabs hoặc edge-tts):
  character_voices:
    Alice: EXAVITQu4vr4xnSDxMaL     # Nữ chính (Bella)
    Bob: pNInz6obpgDQGcFmaJgB       # Nam chính (Adam)
    Narrator: 21m00Tcm4TlvDq8ikWAM   # Dẫn chuyện (Rachel)
    female: EXAVITQu4vr4xnSDxMaL    # Giọng nữ mặc định (nếu nhân vật chưa khai báo)
    male: pNInz6obpgDQGcFmaJgB      # Giọng nam mặc định (nếu nhân vật chưa khai báo)

subtitles:
  enabled: true                 # Tự động tạo .srt & .ass theo thời lượng thật từng shot
  language: vi                  # Ngôn ngữ phụ đề (vi = đọc dòng Vietsub trong script hoặc tự dịch bằng LLM)
  burn_in: true                 # Gắn cứng phụ đề (libass) vào final_video.mp4
  font: Arial                   # Font hiển thị phụ đề (Linux VPS cần cài fonts-dejavu-core / fonts-noto-core)
  font_size: 34                 # Cỡ chữ ASS (theo hệ tọa độ 1280x720)

image:
  # Chọn provider & model tạo ảnh. Ví dụ:
  # - muse2api (Local / VPS miễn phí qua Web):
  #   model_provider: muse2api
  #   model: muse-image
  #   base_url: http://127.0.0.1:18610/v1
  #   api_key: <MUSE2API_KEY>
  # - Google Gemini Flash Image qua Yunwu (nhanh ~2-4s/ảnh):
  #   model_provider: yunwu
  #   model: gemini-3.1-flash-image-preview
  #   base_url: https://yunwu.ai
  #   api_key: <YUNWU_API_KEY>
  # - FLUX qua OpenRouter:
  #   model_provider: openrouter
  #   model: black-forest-labs/flux-1.1-pro
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: <OPENROUTER_API_KEY>
  # (Khi dùng muse2api, có thể đặt biến môi trường VIMAX_MUSE_MEDIA_CONCURRENCY=1..3 để điều chỉnh luồng)
  model_provider: ''
  model: <YOUR_IMAGE_MODEL>
  base_url: <YOUR_IMAGE_BASE_URL>
  api_key: ''

# Keyframes: generate candidates concurrently and compare with the configured LLM.
# Set to 1 to generate one image without VLM selection. The LLM must support vision.
image_selection:
  num_candidates: 2

video:
  # Cấu hình tạo video. Có 3 lựa chọn phổ biến:
  # Lựa chọn 1 (KHUYÊN DÙNG vì tốc độ siêu nhanh ~10-20s/clip): ByteDance Seedance qua Yunwu
  #   model_provider: seedance
  #   model: doubao-seedance-1-0-lite-t2v-250428  (hoặc seedance-2.0-fast)
  #   base_url: https://yunwu.ai/volc/v1
  #   api_key: <YUNWU_API_KEY>
  #
  # Lựa chọn 2 (Seedance 2.0 Fast qua OpenRouter):
  #   model_provider: openrouter
  #   model: bytedance/seedance-2.0-fast
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: <OPENROUTER_API_KEY>
  #
  # Lựa chọn 3 (Google Veo qua Yunwu):
  #   model: veo3.1-fast
  #   base_url: https://yunwu.ai
  #   api_key: <YUNWU_API_KEY>
  model: <YOUR_VIDEO_MODEL>
  base_url: <YOUR_VIDEO_BASE_URL>
  api_key: ''

# Optional. Fill these only when using novel2video planning.
embedding:
  model_provider: openai
  model: <YOUR_EMBEDDING_MODEL>
  base_url: <YOUR_EMBEDDING_BASE_URL>
  api_key: ''

# Optional. Fill these only when using novel2video planning.
reranker:
  model: <YOUR_RERANKER_MODEL>
  base_url: <YOUR_RERANKER_BASE_URL>
  api_key: ''
