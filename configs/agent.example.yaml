# ViMax agent runtime local configuration template.
# Keep real keys out of commits. Prefer environment variables for shared or CI usage.

llm:
  model_provider: openai
  model: <YOUR_LLM_MODEL>
  base_url: <YOUR_LLM_BASE_URL>
  api_key: ''

audio:
  model_provider: native        # native (giữ âm thanh/thoại gốc từ video), elevenlabs, hoặc edge-tts
  model: eleven_multilingual_v2 # hoặc vi-VN-NamMinhNeural (Edge-TTS); bỏ qua nếu provider=native
  base_url: https://api.elevenlabs.io/v1
  api_key: ''                   # ElevenLabs API key (native / Edge-TTS để trống)
  voice: 21m00Tcm4TlvDq8ikWAM   # Giọng mặc định / Người dẫn chuyện (Narrator)
  bgm_file: ''                  # Đường dẫn file nhạc nền mp3/wav (nếu có)
  bgm_volume: 0.15              # Âm lượng nhạc nền (0.0 - 1.0)

  # Phân vai nhiều giọng đọc cho nhiều nhân vật (chỉ dùng khi model_provider là elevenlabs hoặc edge-tts):
  character_voices:
    Alice: EXAVITQu4vr4xnSDxMaL     # Nữ chính (Bella)
    Bob: pNInz6obpgDQGcFmaJgB       # Nam chính (Adam)
    Narrator: 21m00Tcm4TlvDq8ikWAM   # Dẫn chuyện (Rachel)
    female: EXAVITQu4vr4xnSDxMaL    # Giọng nữ mặc định (nếu nhân vật chưa khai báo)
    male: pNInz6obpgDQGcFmaJgB      # Giọng nam mặc định (nếu nhân vật chưa khai báo)

subtitles:
  enabled: true                 # Tự động tạo .srt & .ass theo thời lượng thật từng shot
  language: vi                  # Ngôn ngữ phụ đề (vi = đọc dòng Vietsub trong script hoặc tự dịch bằng LLM)
  burn_in: true                 # Gắn cứng phụ đề (libass) vào final_video.mp4
  font: Arial                   # Font hiển thị phụ đề (Linux VPS cần cài fonts-dejavu-core / fonts-noto-core)
  font_size: 34                 # Cỡ chữ ASS (theo hệ tọa độ 1280x720)

# Manga Vision & Cinematic Director layer (chapter-level world model, spatial
# scene graphs, cinematic scene expansion, CANON/INFERRED/CREATIVE shot
# provenance, report-only visual QA). Default OFF — existing pipeline behavior
# is fully preserved when disabled. Can also be toggled via the
# VIMAX_MANGA_VISION_ENABLED environment variable.
manga_vision:
  enabled: false                # Bật lớp Manga Vision (world model + mở rộng điện ảnh + visual QA report-only)
  max_context_chars: 2400       # Giới hạn ký tự khối WORLD CONTEXT gửi vào prompt storyboard mỗi scene
  qa_max_frame_pairs: 4         # Số cặp (keyframe, panel) tối đa cho mỗi lần VLM review (giảm để tránh 502 upload)
  identity_dedup_embedder: auto # auto | mock | off — auto dùng provider ở mục `embedding` khi hoạt động, hỏng thì tự rơi về mock offline (report-only)
  identity_dedup_threshold: 0.82  # Ngưỡng cosine similarity để coi 2 nhân vật là "nghi trùng danh tính"


quality:                         # Cờ nâng cấp chất lượng (incremental-quality). Mặc định = bản nâng cấp; đổi về giá trị cũ để lùi.
  canon_gate: true               # phase 01: cổng kiểm tra bám cốt truyện (thử lại + tự sửa). false = tắt
  generic_linter: true           # phase 02: bộ kiểm tra prompt dùng chung thay cho guard cứng. false = hành vi cũ
  series_slug: ""                # phase 02: thư mục dữ liệu riêng của bộ truyện trong series/<slug>/ (ví dụ: eleceed)
  ref_policy: profile            # phase 03/05: legacy | all_characters | profile — cách chọn ảnh mẫu cho shot
  max_reference_images: 4        # phase 03: trần số ảnh mẫu gửi cho model ảnh (tự giảm nếu muse2api treo)
  embeddings: dinov2             # phase 04: off | dinov2 — embedding ảnh để làm sạch seed/ghép nhân vật
  text_embeddings: e5            # phase 04: off | e5 — embedding văn bản để gom cảnh/địa điểm
  scene_split_threshold: 0.80    # phase 04: ngưỡng tương đồng khi gom/tách cảnh
  profiles: true                 # phase 05: hồ sơ nhân vật (trang phục/trạng thái/alias)
  profile_min_appearances: 5     # phase 05: chỉ sinh sheet cho nhân vật xuất hiện >= N beat
  identity_qa: true              # phase 06: QA danh tính trên keyframe, làm lại trước khi tạo video
  identity_margin: 0.15          # phase 06: biên an toàn khi so khớp danh tính
  max_keyframe_retakes: 2        # phase 06: số lần làm lại keyframe tối đa
  voice_mode: native_fixed       # phase 07: native | native_fixed | native_with_reference (Muse vẫn lồng tiếng)
  shot_planner: true             # phase 08: lên góc máy theo loại beat + luật đa dạng
  story_memory: true             # phase 09: trí nhớ cốt truyện qua các chương
  exceptions_queue: true         # phase 10: hàng ngoại lệ cho clip/keyframe lỗi
  max_clip_retakes: 1            # phase 10: số lần làm lại clip tối đa
  chapter_budget_images: 0       # phase 10: trần số ảnh mỗi chương (0 = không giới hạn)
  chapter_budget_clips: 0        # phase 10: trần số clip mỗi chương (0 = không giới hạn)


image:
  # Chọn provider & model tạo ảnh. Ví dụ:
  # - muse2api (Local / VPS miễn phí qua Web):
  #   model_provider: muse2api
  #   model: muse-image
  #   base_url: http://127.0.0.1:18610/v1
  #   api_key: <MUSE2API_KEY>
  # - Google Gemini Flash Image qua Yunwu (nhanh ~2-4s/ảnh):
  #   model_provider: yunwu
  #   model: gemini-3.1-flash-image-preview
  #   base_url: https://yunwu.ai
  #   api_key: <YUNWU_API_KEY>
  # - FLUX qua OpenRouter:
  #   model_provider: openrouter
  #   model: black-forest-labs/flux-1.1-pro
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: <OPENROUTER_API_KEY>
  # (Khi dùng muse2api, có thể đặt biến môi trường VIMAX_MUSE_MEDIA_CONCURRENCY=1..3 để điều chỉnh luồng)
  model_provider: ''
  model: <YOUR_IMAGE_MODEL>
  base_url: <YOUR_IMAGE_BASE_URL>
  api_key: ''

# Keyframes: generate candidates concurrently and compare with the configured LLM.
# Set to 1 to generate one image without VLM selection. The LLM must support vision.
image_selection:
  num_candidates: 2

video:
  # Cấu hình tạo video. Có 3 lựa chọn phổ biến:
  # Lựa chọn 1 (KHUYÊN DÙNG vì tốc độ siêu nhanh ~10-20s/clip): ByteDance Seedance qua Yunwu
  #   model_provider: seedance
  #   model: doubao-seedance-1-0-lite-t2v-250428  (hoặc seedance-2.0-fast)
  #   base_url: https://yunwu.ai/volc/v1
  #   api_key: <YUNWU_API_KEY>
  #
  # Lựa chọn 2 (Seedance 2.0 Fast qua OpenRouter):
  #   model_provider: openrouter
  #   model: bytedance/seedance-2.0-fast
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: <OPENROUTER_API_KEY>
  #
  # Lựa chọn 3 (Google Veo qua Yunwu):
  #   model: veo3.1-fast
  #   base_url: https://yunwu.ai
  #   api_key: <YUNWU_API_KEY>
  model: <YOUR_VIDEO_MODEL>
  base_url: <YOUR_VIDEO_BASE_URL>
  api_key: ''

# Optional. Fill these only when using novel2video planning.
embedding:
  # OpenAI-compatible embeddings. Used by novel2video planning AND by the
  # Manga Vision duplicate-identity detector (manga_vision.identity_dedup_embedder: auto).
  model_provider: openai
  model: <YOUR_EMBEDDING_MODEL>
  base_url: <YOUR_EMBEDDING_BASE_URL>
  api_key: ''

# Optional. Fill these only when using novel2video planning.
reranker:
  model: <YOUR_RERANKER_MODEL>
  base_url: <YOUR_RERANKER_BASE_URL>
  api_key: ''
